# Bloque para el nginx que YA tienes en el servidor, para publicar Cuadre en su dominio.
# Cambia finanzas.tudominio.com y la ruta de los certificados.
#  - nginx instalado en el servidor:  UPSTREAM = 127.0.0.1:8090
#  - nginx dentro de Docker:          UPSTREAM = 172.17.0.1:8090 (y HTTP_BIND=172.17.0.1:8090 en .env.production)

server {
    listen 80;
    server_name finanzas.tudominio.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name finanzas.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/finanzas.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzas.tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
